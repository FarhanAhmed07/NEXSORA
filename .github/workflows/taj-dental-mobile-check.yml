name: TAJ DENTAL mobile typecheck

on:
  push:
    branches:
      - feature/dentacare-patient-app
    paths:
      - "apps/dentacare-patient/**"
      - ".github/workflows/taj-dental-mobile-check.yml"
  pull_request:
    paths:
      - "apps/dentacare-patient/**"
      - ".github/workflows/taj-dental-mobile-check.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dentacare-patient
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
